name: Train CNN & GRU

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas matplotlib

      - name: Train CNN (MNIST)
        run: python src/train_cnn.py --epochs 2

      - name: Train GRU (SMS Spam)
        run: python src/train_gru.py --epochs 6

      - name: Commit hasil training
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet && echo "Tidak ada perubahan." || git commit -m "chore: perbarui hasil training [skip ci]"
          git push
